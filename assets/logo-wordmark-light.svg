<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Guildora">
  <title>Guildora</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2670"/>
      <stop offset="1" stop-color="#110F26"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="256" y1="80" x2="256" y2="432">
      <stop offset="0" stop-color="#FFE08A"/>
