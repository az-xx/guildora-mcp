name: Release

# Pushing a tag such as v0.3.0 publishes that version to npm and creates the GitHub release.
# npm publishing uses Trusted Publishing (OIDC): no npm token is stored anywhere, no 2FA prompt,
# and npm attaches a provenance statement linking the package to this workflow run.
# One-time setup on npmjs.com: package Settings > Trusted Publisher > GitHub Actions,
# owner "az-xx", repository "guildora-mcp", workflow "release.yml".

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports Trusted Publishing (11.5.1+)
        run: npm install -g npm@^11.5.1
      - run: npm ci

      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Changelog has an entry for this version
        run: node scripts/release-notes.js "$VERSION" > release-notes.md

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:tools -- --check

      - name: Publish to npm
        run: |
          if npm view "guildora-mcp@$VERSION" version > /dev/null 2>&1; then
            echo "guildora-mcp@$VERSION is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
